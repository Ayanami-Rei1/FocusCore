# Usage: python -m src.train +experiment=baseline_ouc_cge

defaults:
  - override /data: ouc_cge
  - override /model: slow
  - override /trainer: default

experiment:
  name: baseline_ouc_cge
  seed: 42

trainer:
  max_epochs: 50

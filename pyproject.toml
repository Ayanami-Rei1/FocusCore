[project]
name = "focus-core"
version = "0.1.0"
description = "Classroom Group Engagement Recognition from Video"
authors = [
    {name = "Denis Bakin", email = "denis.bakin5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (<2.3.0)",
    "torch (>=2.5.0)",
    "torchvision (>=0.20.0)",
    "pytorchvideo (>=0.1.5)",
    "lightning (>=2.4.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "mlflow (>=3.0.0)",
    "torchmetrics (>=1.0.0)",
    "opencv-python-headless (>=4.10.0)",
    "mediapipe (>=0.10.0)",
    "pandas (>=2.0.0)",
    "scikit-learn (>=1.4.0)",
    "tqdm (>=4.60.0)",
    "matplotlib (>=3.8.0)",
    "pillow (>=10.0.0)",
    "rich (>=13.0.0)",
    "pyyaml (>=6.0.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: tests that require the full OUC-CGE dataset on disk",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F", "E"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/train.py" = ["F403"]
"src/evaluate.py" = ["F403"]
